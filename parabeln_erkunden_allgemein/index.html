<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#195c50">
<title>Parabeln erkunden</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f5f1;color:#19352f;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}main{max-width:620px;margin:auto;padding:24px 16px 28px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.13em;text-transform:uppercase;color:#54736a;margin:0 0 8px}h1{font-size:clamp(27px,6vw,36px);letter-spacing:-.035em;margin:0 0 18px}.assignment{background:#e1eee5;border-left:4px solid #26735f;border-radius:4px 14px 14px 4px;padding:16px 18px;margin-bottom:20px}.assignment p{margin:0;font-size:clamp(18px,4.7vw,22px);line-height:1.45;font-weight:650}.assignment strong{display:block;margin-bottom:5px}.plot-card{background:white;border:1px solid #d9e1db;border-radius:16px;overflow:hidden;box-shadow:0 4px 18px #173a2c08}.plot-heading{display:flex;justify-content:space-between;align-items:center;padding:14px 16px 8px;font-size:13px;color:#61746d}.plot-heading span:first-child{font-weight:700;color:#284c40}.plot{width:100%;aspect-ratio:1;position:relative;overflow:hidden;touch-action:pan-y}#ggb{position:absolute;inset:0;pointer-events:none}#shield{position:absolute;inset:0;z-index:2;touch-action:pan-y}#loading{position:absolute;inset:0;display:grid;place-content:center;text-align:center;padding:30px;background:white;z-index:3;color:#597268;line-height:1.6}#loading[hidden]{display:none}.scale{text-align:center;font-size:12px;color:#61746d;margin:10px 0 0}button{width:100%;min-height:56px;margin-top:18px;border:0;border-radius:13px;background:#195c50;color:white;font:700 17px system-ui;cursor:pointer;box-shadow:0 3px 0 #104538;touch-action:manipulation}button:hover{background:#124b40}button:active{transform:translateY(2px);box-shadow:none}button:focus-visible{outline:3px solid #dd9e2f;outline-offset:4px}button:disabled{opacity:.5;cursor:wait}.foot{margin:18px 0 0;text-align:center;color:#697a73;font-size:12px}@media(max-width:380px){main{padding:16px 10px}.assignment{padding:12px 14px;margin-bottom:14px}h1{margin-bottom:14px}}
</style>
<style>
main{height:100vh;height:100dvh;min-height:440px;max-width:720px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
h1{font-size:clamp(21px,5vw,28px);margin:0;line-height:1.1}
.assignment{display:flex;align-items:center;gap:12px;padding:12px;margin:0;flex-shrink:0}
.assignment p{flex:1;min-width:0;font-size:clamp(14px,3.6vw,18px);line-height:1.35}
.assignment strong{margin-bottom:4px}
button{flex:0 0 98px;width:98px;min-height:64px;margin:0;padding:10px 8px;font-size:15px;line-height:1.3;border-radius:11px}
button span{display:block;font-size:22px;line-height:1.1;margin-top:3px}
.plot-space{flex:1;min-height:210px;min-width:0;display:flex;align-items:center;justify-content:center;container-type:size}
.plot-card{width:min(100%,calc(100cqh - 34px));flex-shrink:0}
.plot-heading{height:32px;padding:0 12px;font-size:12px}
.scale{flex-shrink:0;font-size:11px;margin:0;line-height:1.3}
@media(max-width:350px){main{padding:10px 8px;gap:8px}.assignment{gap:8px;padding:10px}button{flex-basis:82px;width:82px;font-size:14px}}
@media(orientation:landscape) and (max-height:540px){main{min-height:300px;max-width:960px;display:grid;grid-template-columns:minmax(220px,1fr) minmax(240px,1.4fr);grid-template-rows:auto 1fr auto;gap:10px 16px}h1{grid-column:1;grid-row:1}.assignment{grid-column:1;grid-row:2;align-self:start}.plot-space{grid-column:2;grid-row:1 / 4;height:100%;min-height:0}.scale{grid-column:1;grid-row:3}}
</style>
</head>
<body>
<main>
<h1>Parabeln erkunden</h1>
<section class="assignment" aria-label="Arbeitsauftrag"><p><strong>Erkunde verschiedene Parabeln.</strong>Was haben alle gemeinsam?<br>Welche Unterschiede gibt es?</p><button id="next" type="button" disabled>Neue Parabel <span aria-hidden="true">↗</span></button></section>
<div class="plot-space">
<section class="plot-card" aria-label="Parabel im Koordinatensystem">
<div class="plot-heading"><span id="counter" aria-live="polite">Parabel 1</span><span>GeoGebra</span></div>
<div class="plot" id="plot"><div id="ggb" inert aria-hidden="true"></div><div id="shield" role="img" aria-label="Parabel in einem festen Koordinatensystem von minus sechs bis sechs auf beiden Achsen."></div><div id="loading" role="status">Das Koordinatensystem wird geladen …</div></div>
</section>
</div>
<p class="scale">2 Kästchen = 1 Einheit · gleicher Ausschnitt bei jeder Parabel</p>
</main>
<script>
'use strict';
let api, count=0, queue=[], lastKey='';
const button=document.getElementById('next');
const loading=document.getElementById('loading');
const choose=xs=>xs[Math.floor(Math.random()*xs.length)];
function shuffle(xs){for(let i=xs.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[xs[i],xs[j]]=[xs[j],xs[i]];}return xs;}
// Each block covers both openings, all root counts and three width classes.
function makeQueue(){const items=[];for(const sign of [-1,1])for(const roots of [0,1,2])for(const width of ['wide','medium','narrow'])items.push({sign,roots,width,outside:width==='narrow'});return shuffle(items);}
function candidate({sign,roots,width}){
 const magnitude=choose(width==='wide'?[.125,.2]:width==='narrow'?[4,6,8]:[.5,1,2]);
 const h=choose([-3,-2.5,-2,-1.5,-1,-.5,0,.5,1,1.5,2,2.5,3]);
 let k=roots===1?0:sign*(roots===0?1:-1)*choose([.5,1,1.5,2,2.5,3]);
 // Keep both roots visible so root-count comparisons are unambiguous.
 if(roots===2){const maxDepth=magnitude*(5.5-Math.abs(h))**2;k=-sign*Math.min(Math.abs(k),maxDepth);}
 return {a:sign*magnitude,h,k};
}
function nextParabola(){
 if(!api)return;
 if(!queue.length)queue=makeQueue();
 const spec=queue.pop();let p,key;
 do{p=candidate(spec);key=JSON.stringify(p);}while(key===lastKey || (Math.abs(p.a*p.h*p.h+p.k)>6)!==spec.outside);
 lastKey=key;
 api.evalCommand(`f(x)=(${p.a})*(x-(${p.h}))^2+(${p.k})`);
 api.setColor('f',30,100,173);api.setLineThickness('f',6);
 api.setLabelVisible('f',false);api.setFixed('f',true,false);
 api.setCoordSystem(-6,6,-6,6);
 document.getElementById('counter').textContent=`Parabel ${++count}`;
}
function configureGrid(){
 // GeoGebra XML sets the grid spacing independently from axis numbering.
 const doc=new DOMParser().parseFromString(api.getXML(),'application/xml');
 const view=doc.querySelector('euclidianView');
 const settings=view.querySelector('evSettings');
 settings.setAttribute('grid','true');settings.setAttribute('gridType','0');
 let grid=view.querySelector('grid');if(!grid){grid=doc.createElement('grid');view.appendChild(grid);}
 grid.setAttribute('distX','0.5');grid.setAttribute('distY','0.5');grid.setAttribute('distTheta',String(Math.PI/6));
 api.setXML(new XMLSerializer().serializeToString(doc));
 api.setAxisSteps(1,1,1,1);api.setAxisLabels(1,'x','y','');
 api.setAxesVisible(true,true);api.setGridVisible(true);
}
function resize(){if(!api)return;const size=Math.floor(document.getElementById('plot').clientWidth);api.setSize(size,size);api.setCoordSystem(-6,6,-6,6);}
function start(){
 const size=Math.floor(document.getElementById('plot').clientWidth);
 const applet=new GGBApplet({appName:'classic',width:size,height:size,perspective:'G',language:'de',showToolBar:false,showMenuBar:false,showAlgebraInput:false,showResetIcon:false,showZoomButtons:false,showFullscreenButton:false,enableRightClick:false,enableLabelDrags:false,enableShiftDragZoom:false,allowStyleBar:false,showToolBarHelp:false,showSuggestionButtons:false,enableFileFeatures:false,enableCAS:false,enable3d:false,preventFocus:true,errorDialogsActive:false,appletOnLoad:function(ggb){try{api=ggb;configureGrid();resize();nextParabola();loading.hidden=true;button.disabled=false;new ResizeObserver(resize).observe(document.getElementById('plot'));}catch(e){loading.textContent='GeoGebra konnte nicht gestartet werden. Bitte lade die Seite neu.';console.error(e);}}},true);
 applet.inject('ggb');
}
button.addEventListener('click',nextParabola);
const script=document.createElement('script');script.src='https://www.geogebra.org/apps/deployggb.js';script.onload=start;script.onerror=()=>{loading.textContent='GeoGebra ist gerade nicht erreichbar. Prüfe deine Internetverbindung und lade die Seite neu.';};document.head.appendChild(script);
setTimeout(()=>{if(!api)loading.textContent='GeoGebra wird noch geladen. Falls diese Meldung bleibt: Internetverbindung prüfen und die Seite neu laden.';},25000);
</script>
</body>
</html>
